name: Update Homebrew tap

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish (e.g. v0.44.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Blushyes/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo Blushyes/reef \
            --pattern 'reef-darwin-*.tar.gz' --pattern 'reef-linux-*.tar.gz' \
            --dir archives

      - name: Generate formula
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/homebrew-formula.py "$RELEASE_TAG" archives homebrew-tap/Formula/reef.rb

      - name: Publish formula
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add Formula/reef.rb
          if git diff --cached --quiet; then
            echo "Formula already matches $RELEASE_TAG"
            exit 0
          fi
          git commit -m "chore: update reef to $RELEASE_TAG"
          git push origin HEAD:main
